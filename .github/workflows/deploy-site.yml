name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create gh-pages branch from site/
        run: |
          # Switch to master
          git checkout master

          # Create orphan gh-pages branch
          git checkout --orphan gh-pages

          # Remove all files except site/
          git rm -rf .

          # Copy site/ contents to root
          cp -r site/* .
          cp site/.nojekyll .

          # Add all files
          git add .

          # Commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy site to gh-pages"

          # Push to origin
          git push origin gh-pages --force