name: Quality Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "3"
  RUST_TEST_THREADS: "4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Run clippy (workspace, deny warnings)
        run: cargo clippy --workspace -- -D warnings
      - name: Check formatting
        run: cargo fmt -- --check

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cogent-bins-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cogent-bins-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cogent-bins-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cogent-bins-windows
    runs-on: ${{ matrix.os }}
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Build all tools (release)
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/access-control
            target/${{ matrix.target }}/release/cohesion
            target/${{ matrix.target }}/release/comments
            target/${{ matrix.target }}/release/coupling
            target/${{ matrix.target }}/release/crap
            target/${{ matrix.target }}/release/cryptocheck
            target/${{ matrix.target }}/release/deadcode
            target/${{ matrix.target }}/release/debt
            target/${{ matrix.target }}/release/doccov
            target/${{ matrix.target }}/release/dupfind
            target/${{ matrix.target }}/release/errhandle
            target/${{ matrix.target }}/release/fuzz
            target/${{ matrix.target }}/release/halstead
            target/${{ matrix.target }}/release/licenses
            target/${{ matrix.target }}/release/linelen
            target/${{ matrix.target }}/release/mutate
            target/${{ matrix.target }}/release/propcov
            target/${{ matrix.target }}/release/riskmap
            target/${{ matrix.target }}/release/sast
            target/${{ matrix.target }}/release/sbom
            target/${{ matrix.target }}/release/secrets
            target/${{ matrix.target }}/release/supply-chain
            target/${{ matrix.target }}/release/taint
            target/${{ matrix.target }}/release/typecov
            target/${{ matrix.target }}/release/vulnscan
            target/${{ matrix.target }}/release/cogent
            target/${{ matrix.target }}/release/cogent-server
            target/${{ matrix.target }}/release/access-control.exe
            target/${{ matrix.target }}/release/cohesion.exe
            target/${{ matrix.target }}/release/comments.exe
            target/${{ matrix.target }}/release/coupling.exe
            target/${{ matrix.target }}/release/crap.exe
            target/${{ matrix.target }}/release/cryptocheck.exe
            target/${{ matrix.target }}/release/deadcode.exe
            target/${{ matrix.target }}/release/debt.exe
            target/${{ matrix.target }}/release/doccov.exe
            target/${{ matrix.target }}/release/dupfind.exe
            target/${{ matrix.target }}/release/errhandle.exe
            target/${{ matrix.target }}/release/fuzz.exe
            target/${{ matrix.target }}/release/halstead.exe
            target/${{ matrix.target }}/release/licenses.exe
            target/${{ matrix.target }}/release/linelen.exe
            target/${{ matrix.target }}/release/mutate.exe
            target/${{ matrix.target }}/release/propcov.exe
            target/${{ matrix.target }}/release/riskmap.exe
            target/${{ matrix.target }}/release/sast.exe
            target/${{ matrix.target }}/release/sbom.exe
            target/${{ matrix.target }}/release/secrets.exe
            target/${{ matrix.target }}/release/supply-chain.exe
            target/${{ matrix.target }}/release/taint.exe
            target/${{ matrix.target }}/release/typecov.exe
            target/${{ matrix.target }}/release/vulnscan.exe
            target/${{ matrix.target }}/release/cogent.exe
            target/${{ matrix.target }}/release/cogent-server.exe
          if-no-files-found: ignore
          retention-days: 1

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cogent-bins-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cogent-bins-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cogent-bins-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cogent-bins-windows
    runs-on: ${{ matrix.os }}
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/
      - name: Mark binaries executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x target/${{ matrix.target }}/release/*
          fi
      - name: Run workspace tests
        run: cargo test --workspace --target ${{ matrix.target }}

  audit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: cogent-bins-linux
          path: target/release/
      - name: Mark binaries executable
        run: chmod +x target/release/*
      - name: Add tools to PATH
        run: echo "$(pwd)/target/release" >> $GITHUB_PATH
      - name: Install cargo-audit (vulnscan dependency)
        run: cargo install cargo-audit --locked
      - name: Check for technical debt
        run: |
          # Use Cogent's own debt detector (respects .quality.toml and excludes
          # the tools' own marker-detection strings + generated fixtures). The
          # previous raw grep counted those false positives.
          ./target/release/cogent check . --no-cache --format json > debt-check.json || true
          python3 - <<'PY'
          import json, sys
          data = json.load(open("debt-check.json"))
          debt = next((c for c in data.get("checks", []) if c.get("name") == "debt"), None)
          if debt is None:
              print("::error::debt check not found in cogent output")
              sys.exit(1)
          print(f"debt: {debt.get('message')}")
          sys.exit(0 if debt.get("passed") else 1)
          PY
      - name: Run quality self-audit
        run: |
          ./target/release/cogent run . --format sarif \
            --baseline .cogent-baseline.sarif \
            > quality-results.sarif
          if [ $? -ne 0 ]; then
            echo "::error::Quality regression detected compared to baseline"
            exit 1
          fi
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: quality-results.sarif
          category: quality-batch
      - name: Post quality comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sarif = JSON.parse(fs.readFileSync('quality-results.sarif', 'utf8'));
            const results = sarif.runs[0].results || [];
            const tools = {};
            results.forEach(r => {
              const tool = r.ruleId.split('-')[0];
              tools[tool] = (tools[tool] || 0) + 1;
            });
            let body = '## ⚠️ Quality Check Failed\n\n';
            body += 'The following quality issues were found:\n\n';
            for (const [tool, count] of Object.entries(tools)) {
              body += `- **${tool}**: ${count} issue(s)\n`;
            }
            body += '\n### How to Fix\n';
            body += '1. Run `cogent run .` locally to see detailed findings\n';
            body += '2. See [docs/quality-standards.md](docs/quality-standards.md) for fix guidance\n';
            body += '3. View the [Security tab](../../security) for detailed SARIF results\n';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      - name: Update baseline and history on main
        if: github.ref == 'refs/heads/main'
        run: |
          mv quality-results.sarif .cogent-baseline.sarif
          ./target/release/cogent history record
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .cogent-baseline.sarif .cogent-history/ || true
          git commit -m "Update quality baseline and history [ci skip]" || true
          git push origin main || true
    permissions:
      security-events: write
      contents: write
      pull-requests: write

  benchmark:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          name: cogent-bins-linux
          path: target/release/
      - name: Mark binaries executable
        run: chmod +x target/release/*
      - name: Add tools to PATH
        run: echo "$(pwd)/target/release" >> $GITHUB_PATH
      - name: Generate benchmark fixtures
        run: |
          cd crates/cogent-cli/benches/fixtures
          python3 generate.py small --include-issues
      - name: Run Criterion benchmarks
        run: cargo bench -p cogent-cli
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/
          retention-days: 30
