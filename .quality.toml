# .quality.toml — Cogent quality thresholds
# Used by: cogent check . and cogent run .
# Thresholds are set slightly above current baseline values.
# Lower thresholds over time as code quality improves.
#
# NOTE: [override.*] sections are per-path overrides for test files
# and tool crates. They do NOT affect global thresholds — the config
# parser only reads top-level and tool-section values.

[project]
ecosystem = "Rust"
test_cmd = ["cargo","test"]
coverage_cmd = ["cargo","llvm-cov","--lcov","--output-path","lcov.info"]
lcov_path = "lcov.info"

# ── Quality ───────────────────────────────────────────────
[crap]
# CRAP = complexity^2 * (1 - coverage)^3 + complexity. Lower is better.
# Baseline avg: 61.8 — threshold allows ~5% headroom.
max_avg = 63

[debt]
# TODO/FIXME/HACK/XXX markers. Baseline: 16 — tighten toward 0 over time.
max_markers = 18
types = ["TODO", "FIXME", "HACK", "XXX"]

[doc_coverage]
# Public API doc coverage. Baseline: 75.6% — barely passes.
min_pct = 75

[test_quality]
# Non-determinism patterns in tests. Baseline: 80 (benchmarks, mocks, etc.).
# Allow 85 to accommodate test infrastructure.
max_test_quality = 85

[complexity]
# Functions with cyclomatic complexity >= 10. Baseline: 188.
max_violations = 195

[duplication]
# Duplicated code groups. Baseline: 18.
max_duplicates = 20
min_lines = 3

[riskmap]
# Risk score = sqrt(churn) * complexity / 20 (0-100, capped at 100)
max_risk = 75

[comments]
# Minimum comment ratio per file. Baseline: 4.0%.
min_comment_ratio = 0.0

[cohesion]
# LCOM4 violations. Baseline: 2.3.
max_cohesion = 5

# ── Security ──────────────────────────────────────────────
[secrets]
# Hardcoded secret detection. Baseline: 128 (mostly FPs in tool infra).
# Paths excluded via secrets_exclude reduce false positives.
max_secrets = 135
# Paths to exclude from secrets scanning (TOML array or bare comma list)
secrets_exclude = ["crates/cogent-engine", "crates/cogent-cli/src/check_runners"]

[access_control]
# Access control checker. Zero tolerance for findings by default.
max_access_control = 0
# Paths to exclude from access control scanning (TOML array or bare comma list)
access_control_exclude = ["crates/secrets/src/main.rs"]

# ── Error handling ────────────────────────────────────────
[errhandle]
# .unwrap()/.expect() without context. Baseline: 768.
max_errhandle = 780

# ── Line length ───────────────────────────────────────────
[linelen]
# Function/file length violations. Baseline: 285.
max_linelen = 290

# ── Halstead complexity ───────────────────────────────────
[halstead]
# Estimated bugs from operator/operand vocabulary. Baseline: 878.
# Passes because no single file exceeds the per-file threshold.
max_halstead_bugs = 885.0

# ── Fuzz surface ──────────────────────────────────────────
[fuzz]
# Fuzzable endpoints. Baseline: 459.
max_fuzz_risk = 470

# ── Dead code ─────────────────────────────────────────────
[deadcode]
# Unused functions/imports. Baseline: 136. Was 148 with test infrastructure.
# Allow 150 to accommodate test infrastructure dead assignments.
max_deadcode = 150

# ── Per-path overrides ────────────────────────────────────
# Test files get relaxed thresholds since .unwrap() and TODO markers
# in test infrastructure are intentional. These overrides are scoped
# to matching paths and do NOT affect global thresholds.
[override."crates/*/tests/**"]
max_errhandle = 9999
max_linelen = 9999
max_deadcode = 9999
max_secrets = 9999
max_fuzz_risk = 9999
max_risk = 9999

# Bench fixtures are generated test data with high churn/complexity
[override."crates/*/benches/fixtures/**"]
max_risk = 9999
max_taint = 9999
max_secrets = 9999
max_errhandle = 9999

# Bench source files
[override."crates/*/benches/**"]
max_deadcode = 9999

# Tool crates contain self-referential markers (they scan for TODOs)
[override."crates/debt-scan/**"]
max_markers = 9999

[override."crates/cogent-fix/**"]
max_markers = 9999

# Secrets crate test fixtures (hardcoded creds in test data)
[override."crates/secrets/src/main.rs"]
max_access_control = 9999

# Access control test fixtures in main source
[override."crates/access-control/src/main.rs"]
max_deadcode = 9999

# Audit infrastructure
[override."crates/cogent-cli/src/audit.rs"]
max_deadcode = 9999

# Cache infrastructure
[override."crates/cogent-cli/src/cache.rs"]
max_deadcode = 9999

# Bench infrastructure
[override."crates/cogent-cli/src/bench.rs"]
max_deadcode = 9999

# Config infrastructure
[override."crates/cogent-cli/src/config.rs"]
max_deadcode = 9999

# Doctor infrastructure
[override."crates/cogent-cli/src/doctor.rs"]
max_deadcode = 9999

# Main CLI infrastructure
[override."crates/cogent-cli/src/main.rs"]
max_deadcode = 9999

# Mutation test infrastructure
[override."crates/mutation-test/src/main.rs"]
max_deadcode = 9999

# Skip mutation testing in check (requires full cargo build)
[skip]
checks = []
