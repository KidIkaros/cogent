# .quality.toml — Cogent quality thresholds
# Auto-generated for: Rust
# Used by: cogent check . and cogent run .
# Run `cogent init` at any time to regenerate with updated detection.

[project]
ecosystem = "Rust"
test_cmd = ["cargo","test"]
coverage_cmd = ["cargo","llvm-cov","--lcov","--output-path","lcov.info"]
lcov_path = "lcov.info"

[crap]
# CRAP = complexity^2 * (1 - coverage)^3 + complexity. Lower is better.
max_avg = 15

[debt]
max_markers = 0
types = ["TODO", "FIXME", "HACK", "XXX"]

[doc_coverage]
min_pct = 95

[complexity]
max_violations = 0

[duplication]
max_duplicates = 0
min_lines = 3

[riskmap]
# Risk = churn × complexity. Workspace crates have high churn during active development.
max_risk = 100.0

[mutate]
# Mutation kill rate threshold. Lowered while test coverage is being expanded.
min_kill_rate = 0.0

[sast]
# 5 accepted medium-severity findings: unsafe { libc_isatty(2) } in output/progress
# (TTY detection, not attacker-reachable), mutation-test internal unsafe, and
# a false positive in risk-map from a .matches("unsafe {") string literal.
max_findings = 5

[crypto]
# crypto-check excludes its own source; no real findings remain.
max_findings = 0

[skip]
checks = []
