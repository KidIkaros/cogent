[workspace]
members = [ "crates/cogent-common", "crates/ast-parse-ts", "crates/crap-metric", "crates/mutation-test", "crates/debt-scan", "crates/doc-coverage", "crates/duplication", "crates/coupling", "crates/risk-map", "crates/cogent-cli", "crates/cogent-server", "crates/fuzz-surface", "crates/prop-cov", "crates/taint-scan", "crates/line-length", "crates/halstead", "crates/secrets", "crates/dead-code", "crates/cohesion", "crates/comment-ratio", "crates/error-handling", "crates/type-coverage", "crates/vuln-scan", "crates/sast", "crates/crypto-check", "crates/licenses", "crates/sbom", "crates/access-control", "crates/supply-chain",]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/KidIkaros/cogent"
description = "Cogent — production-grade code quality & security auditing toolkit (26 engines, unified CLI)"
keywords = [ "quality", "metrics", "security", "audit", "cli",]
categories = [ "development-tools", "command-line-utilities", "development-tools::testing",]

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
