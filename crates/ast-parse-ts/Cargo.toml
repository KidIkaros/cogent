[package]
name = "ast-parse-ts"
description = "Universal AST parsing via tree-sitter — complexity, doc coverage, identifiers for Rust/Python/JS/TS/Go"

[lib]
name = "ast_parse_ts"
path = "src/lib.rs"

[features]
default = ["rust", "python", "js"]
rust = ["tree-sitter-rust"]
python = ["tree-sitter-python"]
js = ["tree-sitter-javascript"]
ts = ["dep:tree-sitter-typescript", "js"]
go = ["tree-sitter-go"]
c = ["tree-sitter-c"]
cpp = ["tree-sitter-cpp"]
csharp = ["tree-sitter-c-sharp"]
java = ["tree-sitter-java"]
php = ["tree-sitter-php"]
ruby = ["tree-sitter-ruby"]
swift = ["tree-sitter-swift"]
kotlin = ["tree-sitter-kotlin"]
solidity = ["tree-sitter-solidity"]
ocaml = ["tree-sitter-ocaml"]
full = [
    "rust", "python", "js", "ts", "go", "c", "cpp", "csharp",
    "java", "php", "ruby", "swift", "kotlin", "solidity", "ocaml"
]

[dependencies]
tree-sitter = "0.26"
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-kotlin = { version = "0.3", optional = true }
tree-sitter-solidity = { version = "1.2", optional = true }
tree-sitter-ocaml = { version = "0.24", optional = true }

[dev-dependencies]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.repository]
workspace = true

[package.license]
workspace = true