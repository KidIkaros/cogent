[[bin]]
name = "cogent"
path = "src/main.rs"

[package]
name = "cogent-cli"
description = "Unified headless CLI for Cogent -- one command, JSON output, exit codes for CI/agents"

[dependencies]
serde_json = "1"
colored = "2"
chrono = "0.4"
tiny_http = "0.12"
serde_yaml = "0.9"
hex = "0.4"
whoami = "1.5"
tracing = { version = "0.1", features = ["max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.hmac]
version = "0.12"

[dependencies.sha2]
version = "0.10"

[package.version]
workspace = true

[package.edition]
workspace = true

[package.repository]
workspace = true

[package.license]
workspace = true

[package.categories]
workspace = true

[package.keywords]
workspace = true

[dependencies.ast-parse-ts]
path = "../ast-parse-ts"
version = "1.0.0"

[dependencies.cogent-common]
path = "../cogent-common"
version = "1.0.0"

[dependencies.cogent-engine]
path = "../cogent-engine"
version = "1.0.0"

[dependencies.cogent-report]
path = "../cogent-report"
version = "1.0.0"

[dependencies.clap]
version = "4"
features = [ "derive",]

[dependencies.clap_complete]
version = "4"

[dependencies.serde]
version = "1"
features = [ "derive",]

[dependencies.syn]
version = "2"
features = [ "full", "parsing", "visit",]

[dependencies.notify]
version = "6"
features = [ "macos_kqueue",]

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
criterion = "0.5"

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.jsonschema]
version = "0.29"
default-features = false

[[bench]]
name = "check_bench"
harness = false

[[bench]]
name = "tool_bench"
harness = false
