[[bin]]
name = "supply-chain"
path = "src/main.rs"

[package]
name = "supply-chain"
description = "Supply chain checker — dependency integrity, typosquatting, abandoned packages, and unpinned version risks"

[dependencies]
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"

[package.version]
workspace = true

[package.edition]
workspace = true

[package.repository]
workspace = true

[package.license]
workspace = true

[dependencies.cogent-common]
path = "../cogent-common"
version = "1.0.0"

[dependencies.clap]
version = "4"
features = ["derive"]

[dependencies.serde]
version = "1"
features = ["derive"]
