<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Geometric mark: hexagonal frame with angular C negative space -->
  <g transform="translate(30,50)" filter="url(#glow)">
    <!-- Outer hexagon -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"
             fill="none" stroke="#e4f222" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner angular C stroke -->
    <polyline points="8,-14 -6,0 8,14" fill="none" stroke="#e4f222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="70" y="62" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="510" fill="#e6e6e6" letter-spacing="-0.03em">Cogent</text>

  <!-- Subtle accent dot -->
  <circle cx="70" cy="74" r="2.5" fill="#e4f222"/>
</svg>